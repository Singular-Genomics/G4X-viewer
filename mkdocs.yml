# repo-a/mkdocs.yml
INHERIT: docs/_core/core.mkdocs.yml

# region Site
site_url: https://docs.singulargenomics.com/G4X-viewer/
site_description: Singular Genomics G4X-viewer documentation site

repo_name: G4X-viewer
repo_url: https://github.com/Singular-Genomics/G4X-viewer

theme:
  features:
    - navigation.tabs
    - navigation.expand
    - navigation.indexes


nav:
  - Docs Home: https://docs.singulargenomics.com
  - G4X-helpers: https://docs.singulargenomics.com/G4X-helpers/

  - G4X-viewer:
    - Home: index.md
    - Usage:
      - Overview: usage/index.md
      - source files: usage/source_files.md
      - protein layer: usage/protein.md
      - fH&E: usage/fhe.md
      - transcript layer: usage/transcript.md
      - segmentation: usage/segmentation.md
      - flow cytometry filter: usage/flow_cytometry.md
      - UMAP filter: usage/umap.md
    - Dashboard: dashboard.md
    - Resources: resources.md
    - Contribute: contributing.md

